name: Release desktop app

# Pushing a version tag (v1.0.0, v1.1.0, ...) builds the Windows installer and
# portable .exe and attaches them to a GitHub Release for that tag. Running the
# workflow by hand builds the same files as a workflow artifact, and also
# publishes a Release when a tag is given.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Publish a GitHub Release with this tag (for example v1.0.0). Leave empty to build only.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows installer and portable app
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: armin-terminal-windows
          path: release/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Armin Terminal ${{ inputs.tag || github.ref_name }}
          files: release/*.exe
          fail_on_unmatched_files: true
          body: |
            Windows desktop build of Armin Terminal.

            - `Armin-Terminal-Setup-*.exe` installs the app with Start menu and desktop shortcuts.
            - `Armin-Terminal-*-Portable.exe` runs without installing.

            The executables are not code-signed, so Windows SmartScreen may show "Windows protected your PC" on first launch. Choose "More info", then "Run anyway".
